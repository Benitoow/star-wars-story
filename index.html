<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Story</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #07070f; color: #ffe81f; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
    .notice { max-width: 480px; padding: 2rem; text-align: center; border: 1px solid #ffe81f33; border-radius: 8px; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: #aaa; font-size: 0.9rem; line-height: 1.6; }
    code { background: #ffffff11; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="notice">
    <h1>Star Wars Story</h1>
    <p>This is the source repository. To run the app locally:</p>
    <p><code>npm install</code> then <code>npm run dev</code></p>
    <p>The live version is deployed via Cloudflare Pages from the <code>src/</code> SvelteKit application.</p>
  </div>
</body>
</html>
