<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFE81F" />
  <title>Mode hors ligne — Star Wars Story Manager</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07070f;
      --card: #111126;
      --text: #e8e8e8;
      --muted: #9da3b0;
      --gold: #ffe81f;
      --border: rgba(255, 232, 31, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1a1a33 0%, var(--bg) 48%);
      color: var(--text);
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      background: color-mix(in oklab, var(--card) 92%, black 8%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.2;
      color: var(--gold);
    }

    p {
      margin: 0 0 12px;
      color: var(--text);
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }

    button {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
  </style>
</head>
<body>
  <main>
    <h1>Connexion indisponible</h1>
    <p>Vous êtes hors ligne. Les contenus déjà visités restent accessibles, mais les nouvelles données réseau ne peuvent pas être chargées.</p>
    <p class="muted">Revenez en ligne puis rechargez la page pour reprendre toutes les fonctionnalités.</p>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
  </main>
</body>
</html>
